{{ define "form-contact" }}
<form class="form" action="api/email" method="post">
    <h2>✦ Contacto </h2>

    <!-- email -->
    <div class="form-field-group">


        <label
            for="email">Correo electrónico</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="liu@ruyan.com"
            autocomplete="email">


    </div>

    <!-- área de msg -->
    <div class="form-field-group">


        <label
            for="msg"
            >Mensaje</label>

        <textarea
            id="msg"
            name="message"
            placeholder="baobeinaibai ..."
            ></textarea>

        <span
            class="form-help-text"
            >Máx. 500 caracteres</span>


    </div>

    <hr class="divider">

    <button type="submit" class="form-send-button">Enviar</button>

    <hr class="divider">

</form>
{{ end }}
